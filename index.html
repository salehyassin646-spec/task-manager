<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 400px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }

        h2 {
            text-align: center;
            color: #4a148c;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #764ba2;
        }

        #addBtn {
            padding: 0 20px;
            background: linear-gradient(45deg, #4a148c, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s;
        }

        #addBtn:hover {
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
        
        #addBtn:active {
            transform: scale(0.97);
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 30px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        ul::-webkit-scrollbar { width: 6px; }
        ul::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ul::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 10px; }
        ul::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        li {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
            animation: slideIn 0.3s ease;
            transition: all 0.2s;
        }

        li:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        li.completed span {
            text-decoration: line-through;
            color: #aaa;
            font-style: italic;
        }

        li.completed {
            background-color: #fafafa;
            border-color: #eaeaea;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            line-height: 1;
        }

        .action-btn:active { transform: scale(0.9); }

        .doneBtn {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .doneBtn:hover { background-color: #c8e6c9; }

        .delBtn {
            background-color: #ffebee;
            color: #c62828;
        }
        .delBtn:hover { background-color: #ffcdd2; }

        .footer-credit {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .footer-credit span {
            color: #4a148c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>قائمة المهام</h2>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="أدخل مهمة جديدة...">
            <button id="addBtn" onclick="addTask()">+</button>
        </div>

        <ul id="taskList"></ul>

        <div class="footer-credit">
            تم تطوير الموقع بواسطة المبرمج <span>صالح ياسين</span>
        </div>
    </div>

    <script>
        window.onload = function() {
            var savedTasks = localStorage.getItem("proTasks");
            if (savedTasks) {
                document.getElementById("taskList").innerHTML = savedTasks;
            }
        };

        function addTask() {
            var input = document.getElementById("taskInput");
            var taskText = input.value.trim();
            if(taskText === "") return;

            var ul = document.getElementById("taskList");
            var li = document.createElement("li");
            
            li.innerHTML = `
                <span>${taskText}</span>
                <div class="actions">
                    <button class="action-btn doneBtn" onclick="toggleTask(this)">✓</button>
                    <button class="action-btn delBtn" onclick="removeTask(this)">✕</button>
                </div>
            `;
            
            ul.appendChild(li);
            saveData();
            input.value = "";
            input.focus();
        }

        function toggleTask(btn) {
            var li = btn.parentElement.parentElement;
            li.classList.toggle("completed");
            saveData();
        }

        function removeTask(btn) {
            var li = btn.parentElement.parentElement;
            li.style.animation = 'fadeOut 0.3s ease';
            setTimeout(function() {
                li.remove();
                saveData();
            }, 290);
        }

        var styleSheet = document.createElement("style");
        styleSheet.type = "text/css";
        styleSheet.innerText = "@keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-20px); } }";
        document.head.appendChild(styleSheet);

        function saveData() {
            localStorage.setItem("proTasks", document.getElementById("taskList").innerHTML);
        }

        var inputField = document.getElementById("taskInput");
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>
</body>
</html>
